<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>졸업요건 분석 — 수원대 스마트 시간표</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3B82F6; --blue-dark: #2563EB; --blue-bg: #EFF6FF; --blue-mid: #DBEAFE;
      --text-dark: #0F172A; --text-mid: #334155; --text-soft: #64748B;
      --border: #E2E8F0; --white: #FFFFFF; --bg: #F8FAFF;
      --c1: #3B82F6; --c2: #7C3AED; --c3: #16A34A; --c4: #D97706; --c5: #EC4899;
    }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

    /* NAVBAR */
    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .navbar-inner { max-width: 1100px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { width: 34px; height: 34px; background: var(--blue); border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
    .logo-mark svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-label { font-size: 16px; font-weight: 700; color: var(--text-dark); letter-spacing: -.4px; }
    .logo-label em { font-style: normal; color: var(--blue); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { font-size: 14px; font-weight: 500; color: var(--text-soft); text-decoration: none; transition: color .18s; }
    .nav-links a:hover { color: var(--blue); }
    .nav-cta { padding: 8px 18px; background: var(--blue); color: #fff !important; border-radius: 9px; font-weight: 600 !important; transition: background .18s !important; }
    .nav-cta:hover { background: var(--blue-dark) !important; }

    /* SUMMARY BANNER */
    .summary-banner { background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%); color: #fff; padding: 44px 32px; }
    .sb-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px; }
    .sb-label { font-size: 13px; font-weight: 600; opacity: .75; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px; }
    .sb-student { font-size: 22px; font-weight: 900; letter-spacing: -.5px; margin-bottom: 12px; }
    .sb-overall-bar-wrap { height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; max-width: 400px; }
    .sb-overall-bar { height: 100%; background: #fff; border-radius: 4px; transition: width 1.2s cubic-bezier(.4,0,.2,1); width: 0%; }
    .sb-overall-text { font-size: 13px; opacity: .85; margin-top: 8px; }
    .sb-remain { text-align: right; }
    .sb-remain-num { font-size: 56px; font-weight: 900; line-height: 1; }
    .sb-remain-lbl { font-size: 14px; opacity: .75; margin-top: 4px; }

    /* PAGE CONTENT */
    .content { max-width: 1100px; margin: 0 auto; padding: 40px 32px 60px; display: flex; flex-direction: column; gap: 36px; }

    /* SECTION HEADER */
    .section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 800; letter-spacing: -.4px; }
    .section-sub { font-size: 13px; color: var(--text-soft); }

    /* CHARTS GRID */
    .charts-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    .chart-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; transition: transform .18s, box-shadow .18s; cursor: default; }
    .chart-card:hover { transform: translateY(-4px); box-shadow: 0 10px 32px rgba(0,0,0,.1); }
    .donut-wrap { position: relative; width: 80px; height: 80px; margin-bottom: 14px; }
    .donut-wrap svg { transform: rotate(-90deg); }
    .donut-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .donut-pct { font-size: 16px; font-weight: 900; }
    .chart-name { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
    .chart-credits { font-size: 12px; color: var(--text-soft); }
    .chart-remain { font-size: 11px; font-weight: 600; margin-top: 6px; padding: 3px 10px; border-radius: 999px; }
    .remain-ok { background: #F0FDF4; color: #16A34A; }
    .remain-need { background: #FEF2F2; color: #EF4444; }

    /* PROGRESS LIST */
    .progress-list { background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .pl-row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
    .pl-row:last-child { border-bottom: none; }
    .pl-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .pl-info { display: flex; flex-direction: column; gap: 6px; }
    .pl-name { font-size: 14px; font-weight: 600; }
    .pl-bar-wrap { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .pl-bar { height: 100%; border-radius: 3px; transition: width 1.2s cubic-bezier(.4,0,.2,1); width: 0%; }
    .pl-nums { font-size: 13px; font-weight: 700; text-align: right; white-space: nowrap; }
    .pl-nums span { font-size: 11px; font-weight: 500; color: var(--text-soft); display: block; margin-top: 2px; }

    /* CHECKLIST */
    .checklist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .check-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
    .cc-dept { font-size: 12px; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .cc-dept::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .check-item { display: flex; align-items: center; gap:10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .check-item:last-child { border-bottom: none; padding-bottom: 0; }
    .ci-icon { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; flex-shrink: 0; }
    .ci-done { background: #F0FDF4; color: #16A34A; }
    .ci-todo { background: #FEF2F2; color: #EF4444; }
    .ci-prog { background: #FFFBEB; color: #D97706; }
    .ci-name { flex: 1; }
    .ci-cr { font-weight: 600; color: var(--text-soft); font-size: 12px; }
    .ci-badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-done { background: #F0FDF4; color: #16A34A; }
    .badge-todo { background: #FEF2F2; color: #EF4444; }
    .badge-prog { background: #FFFBEB; color: #D97706; }

    /* RECOMMEND */
    .recommend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .rec-card { background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; transition: border-color .18s, transform .18s, box-shadow .18s; cursor: pointer; }
    .rec-card:hover { border-color: var(--blue-mid); transform: translateY(-3px); box-shadow: 0 8px 28px rgba(59,130,246,.13); }
    .rec-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
    .rec-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
    .rec-prof { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; }
    .rec-footer { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .rec-cr { font-weight: 700; color: var(--text-mid); }
    .rec-reason { color: var(--text-soft); }

    footer { background: #fff; border-top: 1px solid var(--border); padding: 28px 32px; text-align: center; font-size: 12.5px; color: #94a3b8; line-height: 1.8; margin-top: auto; }
    footer strong { color: var(--text-soft); }

    @media (max-width: 900px) {
      .charts-grid { grid-template-columns: repeat(3, 1fr); }
      .checklist-grid { grid-template-columns: 1fr; }
      .recommend-grid { grid-template-columns: 1fr 1fr; }
      .sb-inner { grid-template-columns: 1fr; }
      .sb-remain { text-align: left; }
    }
    @media (max-width: 600px) {
      .navbar-inner { padding: 0 16px; }
      .nav-links a:not(.nav-cta) { display: none; }
      .summary-banner { padding: 32px 16px; }
      .content { padding: 28px 16px 40px; }
      .charts-grid { grid-template-columns: repeat(2, 1fr); }
      .recommend-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="index.html">
      <div class="logo-mark"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="13" x2="16" y2="13" stroke-width="1.5"/><line x1="8" y1="17" x2="13" y2="17" stroke-width="1.5"/></svg></div>
      <span class="logo-label"><em>수원대</em> 스마트 시간표</span>
    </a>
    <div class="nav-links">
      <a href="rooms.html">빈 강의실</a>
      <a href="graduation.html" style="color:var(--blue);font-weight:700;">졸업요건</a>
      <a href="input.html" class="nav-cta">시간표 만들기</a>
    </div>
  </div>
</nav>

<!-- SUMMARY BANNER -->
<div class="summary-banner">
  <div class="sb-inner">
    <div>
      <div class="sb-label">졸업요건 분석</div>
      <div class="sb-student">컴퓨터학부 · 3학년 2학기</div>
      <div class="sb-overall-bar-wrap">
        <div class="sb-overall-bar" id="overallBar"></div>
      </div>
      <div class="sb-overall-text">전체 졸업요건 <strong id="overallPct">0</strong>% 달성 · 이수 90학점 / 전체 130학점</div>
    </div>
    <div class="sb-remain">
      <div class="sb-remain-num">40</div>
      <div class="sb-remain-lbl">학점 남음</div>
    </div>
  </div>
</div>

<div class="content">

  <!-- 학점 영역별 현황 -->
  <div>
    <div class="section-header">
      <div class="section-title">영역별 이수 현황</div>
      <div class="section-sub">각 영역의 달성률을 확인하세요</div>
    </div>
    <div class="charts-grid" id="chartsGrid"></div>
  </div>

  <!-- 진행 바 상세 -->
  <div>
    <div class="section-header">
      <div class="section-title">세부 학점 현황</div>
    </div>
    <div class="progress-list" id="progressList"></div>
  </div>

  <!-- 전공 필수 이수 체크리스트 -->
  <div>
    <div class="section-header">
      <div class="section-title">필수 과목 이수 현황</div>
      <div class="section-sub">미이수 과목을 이번 학기 시간표에 반영해보세요</div>
    </div>
    <div class="checklist-grid" id="checklistGrid"></div>
  </div>

  <!-- 추천 과목 -->
  <div>
    <div class="section-header">
      <div class="section-title">이번 학기 추천 과목</div>
      <div class="section-sub">미이수 필수과목과 졸업요건을 고려한 추천입니다</div>
    </div>
    <div class="recommend-grid" id="recommendGrid"></div>
  </div>

</div>

<footer><strong>수원대 스마트 시간표</strong> · 수원대학교 비공식 서비스<br/>© 2025 All rights reserved.</footer>

<script>
/* ─ 데이터 ─ */
const CATEGORIES = [
  { name:'전공필수', done:33, total:45, color:'#3B82F6' },
  { name:'전공선택', done:18, total:30, color:'#7C3AED' },
  { name:'교양필수', done:14, total:20, color:'#16A34A' },
  { name:'교양선택', done:8,  total:10, color:'#D97706' },
  { name:'기타·자유', done:17, total:25, color:'#EC4899' },
];

const CHECKLIST = [
  { dept:'전공필수', color:'#3B82F6', items:[
    { name:'이산수학',         cr:3, status:'done' },
    { name:'자료구조',         cr:3, status:'done' },
    { name:'알고리즘',         cr:3, status:'done' },
    { name:'운영체제',         cr:3, status:'done' },
    { name:'데이터베이스',     cr:3, status:'done' },
    { name:'선형대수학',       cr:3, status:'prog' },
    { name:'컴퓨터구조',       cr:3, status:'todo' },
    { name:'캡스톤디자인',     cr:3, status:'todo' },
    { name:'소프트웨어공학',   cr:3, status:'todo' },
    { name:'컴파일러이론',     cr:3, status:'todo' },
  ]},
  { dept:'교양필수', color:'#16A34A', items:[
    { name:'글쓰기와소통',     cr:2, status:'done' },
    { name:'기술영어',         cr:2, status:'done' },
    { name:'창의적사고와문제',  cr:2, status:'done' },
    { name:'소양과인성',       cr:2, status:'done' },
    { name:'영어회화 1',       cr:2, status:'done' },
    { name:'영어회화 2',       cr:2, status:'done' },
    { name:'취업전략세미나',   cr:2, status:'prog' },
  ]},
];

const RECOMMENDS = [
  { name:'컴퓨터구조',     prof:'이승훈', cr:3, type:'전공필수', color:'#3B82F6', reason:'졸업필수 미이수', days:'월수 11:00~12:50' },
  { name:'캡스톤디자인',   prof:'김태훈', cr:3, type:'전공필수', color:'#3B82F6', reason:'졸업필수 미이수', days:'월 14:00~16:50' },
  { name:'소프트웨어공학', prof:'윤소희', cr:3, type:'전공필수', color:'#3B82F6', reason:'졸업필수 미이수', days:'화목 13:00~14:50' },
  { name:'컴파일러이론',   prof:'배지수', cr:3, type:'전공선택', color:'#7C3AED', reason:'전공선택 12학점 미달', days:'월화 11:00~12:50' },
  { name:'취업전략세미나', prof:'강인서', cr:2, type:'교양필수', color:'#16A34A', reason:'교양필수 미이수', days:'금 10:00~11:50' },
  { name:'인공지능개론',   prof:'강도현', cr:3, type:'전공선택', color:'#7C3AED', reason:'전공선택 채우기 추천', days:'수 10:00~12:50' },
];

/* ─ 도넛 차트 ─ */
function donut(pct, color) {
  const bg = '#E2E8F0';
  const r = 15.9;
  const dashFill = pct;
  const dashGap = 100 - pct;
  return `
    <svg viewBox="0 0 36 36" width="80" height="80">
      <circle cx="18" cy="18" r="${r}" fill="none" stroke="${bg}" stroke-width="4"/>
      <circle cx="18" cy="18" r="${r}" fill="none" stroke="${color}" stroke-width="4"
        stroke-dasharray="${dashFill} ${dashGap}" stroke-linecap="round"
        transform="rotate(-90 18 18)" class="donut-arc"/>
    </svg>`;
}

/* ─ 렌더링 ─ */
function renderCharts() {
  let h = '';
  CATEGORIES.forEach(c => {
    const pct = Math.round(c.done / c.total * 100);
    const rem = c.total - c.done;
    const remCls = rem === 0 ? 'remain-ok' : 'remain-need';
    const remTxt = rem === 0 ? '이수 완료' : `${rem}학점 남음`;
    h += `
      <div class="chart-card">
        <div class="donut-wrap">
          ${donut(pct, c.color)}
          <div class="donut-center"><div class="donut-pct" style="color:${c.color}">${pct}%</div></div>
        </div>
        <div class="chart-name">${c.name}</div>
        <div class="chart-credits">${c.done} / ${c.total}학점</div>
        <div class="chart-remain ${remCls}">${remTxt}</div>
      </div>`;
  });
  document.getElementById('chartsGrid').innerHTML = h;
}

function renderProgress() {
  let h = '';
  CATEGORIES.forEach(c => {
    const pct = Math.round(c.done / c.total * 100);
    const rem = c.total - c.done;
    h += `
      <div class="pl-row">
        <div class="pl-dot" style="background:${c.color};margin:0 auto;"></div>
        <div class="pl-info">
          <div class="pl-name">${c.name}</div>
          <div class="pl-bar-wrap"><div class="pl-bar" data-w="${pct}" style="background:${c.color};"></div></div>
        </div>
        <div class="pl-nums">${c.done}학점<span>${rem > 0 ? `${rem}학점 부족` : '✓ 충족'}</span></div>
      </div>`;
  });
  document.getElementById('progressList').innerHTML = h;
}

function renderChecklist() {
  let h = '';
  const statusInfo = { done:['✓','ci-done','badge-done','이수 완료'], todo:['✗','ci-todo','badge-todo','미이수'], prog:['▶','ci-prog','badge-prog','수강 중'] };
  CHECKLIST.forEach(group => {
    const items = group.items.map(item => {
      const [icon, iconCls, badgeCls, label] = statusInfo[item.status];
      return `
        <div class="check-item">
          <div class="ci-icon ${iconCls}">${icon}</div>
          <div class="ci-name">${item.name}</div>
          <div class="ci-cr">${item.cr}학점</div>
          <div class="ci-badge ${badgeCls}">${label}</div>
        </div>`;
    }).join('');
    h += `
      <div class="check-card">
        <div class="cc-dept" style="--dot-color:${group.color}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${group.color};"></span>
          ${group.dept}
        </div>
        ${items}
      </div>`;
  });
  document.getElementById('checklistGrid').innerHTML = h;
}

function renderRecommends() {
  let h = '';
  RECOMMENDS.forEach(r => {
    h += `
      <div class="rec-card" onclick="location.href='input.html'">
        <div class="rec-badge" style="background:${r.color}1c;color:${r.color};">${r.type}</div>
        <div class="rec-name">${r.name}</div>
        <div class="rec-prof">${r.prof} 교수</div>
        <div class="rec-footer">
          <div class="rec-cr">${r.cr}학점 · ${r.days}</div>
          <div class="rec-reason">📌 ${r.reason}</div>
        </div>
      </div>`;
  });
  document.getElementById('recommendGrid').innerHTML = h;
}

/* ─ 초기화 ─ */
renderCharts();
renderProgress();
renderChecklist();
renderRecommends();

/* 애니메이션 */
requestAnimationFrame(() => {
  setTimeout(() => {
    const overall = Math.round(90 / 130 * 100);
    document.getElementById('overallBar').style.width = overall + '%';
    document.getElementById('overallPct').textContent = overall;
    document.querySelectorAll('.pl-bar').forEach(b => {
      b.style.width = b.dataset.w + '%';
    });
  }, 100);
});
</script>
</body>
</html>
