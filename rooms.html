<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빈 강의실 찾기 — 수원대 스마트 시간표</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3B82F6; --blue-dark: #2563EB; --blue-bg: #EFF6FF; --blue-mid: #DBEAFE;
      --green: #10B981; --green-bg: #ECFDF5; --green-mid: #A7F3D0;
      --red: #EF4444; --red-bg: #FEF2F2; --red-mid: #FECACA;
      --text-dark: #0F172A; --text-mid: #334155; --text-soft: #64748B;
      --border: #E2E8F0; --white: #FFFFFF; --bg: #F8FAFF;
    }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

    /* NAVBAR */
    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .navbar-inner { max-width: 1100px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { width: 34px; height: 34px; background: var(--blue); border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
    .logo-mark svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-label { font-size: 16px; font-weight: 700; color: var(--text-dark); letter-spacing: -.4px; }
    .logo-label em { font-style: normal; color: var(--blue); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { font-size: 14px; font-weight: 500; color: var(--text-soft); text-decoration: none; transition: color .18s; }
    .nav-links a:hover { color: var(--blue); }
    .nav-cta { padding: 8px 18px; background: var(--blue); color: #fff !important; border-radius: 9px; font-weight: 600 !important; transition: background .18s !important; }
    .nav-cta:hover { background: var(--blue-dark) !important; }

    /* HERO */
    .hero { background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%); color: #fff; padding: 48px 32px 40px; text-align: center; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 6px 16px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
    .hero-badge-dot { width: 7px; height: 7px; background: #4ADE80; border-radius: 50%; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }
    .hero-time { font-size: clamp(36px, 6vw, 56px); font-weight: 900; letter-spacing: -2px; line-height: 1; margin-bottom: 10px; }
    .hero-period { font-size: 18px; font-weight: 500; opacity: .85; }
    .hero-sub { font-size: 14px; opacity: .7; margin-top: 6px; }

    /* PERIOD SELECTOR */
    .period-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 32px 0; }
    .period-title { font-size: 13px; font-weight: 600; color: var(--text-soft); margin-bottom: 12px; letter-spacing: .5px; text-transform: uppercase; }
    .period-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .period-btn { padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: all .18s; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; }
    .period-btn:hover:not(.active) { border-color: var(--blue-mid); color: var(--blue); }
    .period-btn.active { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }

    /* BUILDING TABS */
    .bldg-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 32px 0; }
    .bldg-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .bldg-btn { padding: 10px 20px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; font-size: 14px; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: all .18s; font-family: 'Noto Sans KR', sans-serif; display: flex; align-items: center; gap: 6px; }
    .bldg-btn:hover:not(.active) { border-color: var(--blue-mid); }
    .bldg-btn.active { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
    .bldg-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
    .bldg-btn.active .bldg-badge { background: var(--blue); color: #fff; }
    .bldg-btn:not(.active) .bldg-badge { background: var(--bg); color: var(--text-soft); }

    /* STATS BAR */
    .stats-bar { max-width: 1100px; margin: 0 auto; padding: 16px 32px 0; display: flex; gap: 16px; align-items: center; }
    .stat-pill { padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .sp-avail { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-mid); }
    .sp-busy { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-mid); }
    .stat-sep { color: var(--border); font-size: 18px; }

    /* ROOM GRID */
    .rooms-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 32px 60px; }
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .room-card { background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s; position: relative; overflow: hidden; }
    .room-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.1); }
    .room-card.available { border-color: var(--green-mid); }
    .room-card.available:hover { border-color: var(--green); box-shadow: 0 8px 28px rgba(16,185,129,.15); }
    .room-card.busy { border-color: var(--border); opacity: .7; }
    .room-card.busy:hover { opacity: 1; }
    .rc-status { position: absolute; top: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; }
    .available .rc-status { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
    .busy .rc-status { background: #CBD5E1; }
    .rc-num { font-size: 20px; font-weight: 800; letter-spacing: -.5px; color: var(--text-dark); margin-bottom: 4px; }
    .rc-cap { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; }
    .rc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .rc-tag { padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 600; background: var(--bg); color: var(--text-soft); border: 1px solid var(--border); }
    .rc-avail-label { font-size: 12px; font-weight: 700; }
    .available .rc-avail-label { color: var(--green); }
    .busy .rc-avail-label { color: #94A3B8; }
    .rc-schedule { margin-top: 10px; display: flex; gap: 3px; }
    .rc-slot { flex: 1; height: 5px; border-radius: 2px; }
    .rc-slot.occ { background: #FECACA; }
    .rc-slot.free { background: var(--green-mid); }
    .rc-slot.cur { background: var(--blue); border-radius: 3px; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text-soft); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state .msg { font-size: 16px; font-weight: 600; color: var(--text-mid); }
    .empty-state .sub { font-size: 13px; margin-top: 4px; }

    footer { background: #fff; border-top: 1px solid var(--border); padding: 28px 32px; text-align: center; font-size: 12.5px; color: #94a3b8; line-height: 1.8; margin-top: auto; }
    footer strong { color: var(--text-soft); }

    @media (max-width: 600px) {
      .navbar-inner { padding: 0 16px; }
      .nav-links a:not(.nav-cta) { display: none; }
      .hero { padding: 36px 16px 32px; }
      .period-wrap, .bldg-wrap, .stats-bar, .rooms-wrap { padding-left: 16px; padding-right: 16px; }
      .rooms-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="index.html">
      <div class="logo-mark"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="13" x2="16" y2="13" stroke-width="1.5"/><line x1="8" y1="17" x2="13" y2="17" stroke-width="1.5"/></svg></div>
      <span class="logo-label"><em>수원대</em> 스마트 시간표</span>
    </a>
    <div class="nav-links">
      <a href="rooms.html" style="color:var(--blue);font-weight:700;">빈 강의실</a>
      <a href="graduation.html">졸업요건</a>
      <a href="input.html" class="nav-cta">시간표 만들기</a>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-badge"><span class="hero-badge-dot"></span>실시간 강의실 현황</div>
  <div class="hero-time" id="heroTime">--:--</div>
  <div class="hero-period" id="heroPeriod">현재 교시 확인 중...</div>
  <div class="hero-sub" id="heroSub"></div>
</div>

<!-- PERIOD SELECTOR -->
<div class="period-wrap">
  <div class="period-title">교시 선택</div>
  <div class="period-row" id="periodRow"></div>
</div>

<!-- BUILDING TABS -->
<div class="bldg-wrap">
  <div class="bldg-row" id="bldgRow"></div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-pill sp-avail">● 사용 가능 <span id="availCount">-</span>개</div>
  <div class="stat-pill sp-busy">● 사용 중 <span id="busyCount">-</span>개</div>
</div>

<!-- ROOM GRID -->
<div class="rooms-wrap">
  <div class="rooms-grid" id="roomGrid"></div>
</div>

<footer><strong>수원대 스마트 시간표</strong> · 수원대학교 비공식 서비스<br/>© 2025 All rights reserved.</footer>

<script>
/* ─ 시간 정의 ─ */
const PERIOD_RANGES = [
  [9,0,9,50],[10,0,10,50],[11,0,11,50],[12,0,12,50],[13,0,13,50],
  [14,0,14,50],[15,0,15,50],[16,0,16,50],[17,0,17,50]
];
const PERIOD_LABELS = ['1교시 9:00','2교시 10:00','3교시 11:00','4교시 12:00','5교시 13:00','6교시 14:00','7교시 15:00','8교시 16:00','9교시 17:00'];

/* ─ 건물 데이터 ─ */
const BUILDINGS = [
  { id:'it', name:'정보과학관', icon:'💻', rooms:[
    { name:'101호', cap:60, tags:['빔프로젝터','에어컨'],          sch:[0,1,1,0,0,1,1,0,0] },
    { name:'201호', cap:40, tags:['빔프로젝터','에어컨','PC실'],   sch:[1,1,0,0,1,1,0,0,0] },
    { name:'202호', cap:35, tags:['빔프로젝터','에어컨','PC실'],   sch:[0,0,1,1,0,0,1,1,0] },
    { name:'301호', cap:60, tags:['빔프로젝터','에어컨'],          sch:[1,0,1,0,1,0,1,0,0] },
    { name:'302호', cap:60, tags:['빔프로젝터','에어컨'],          sch:[0,1,0,1,0,1,0,1,0] },
    { name:'401호', cap:80, tags:['빔프로젝터','에어컨','영상장비'],sch:[1,1,0,0,0,1,1,0,0] },
    { name:'402호', cap:30, tags:['에어컨','PC실','세미나룸'],      sch:[0,0,1,0,1,0,0,1,0] },
  ]},
  { id:'eng', name:'공학관', icon:'⚙️', rooms:[
    { name:'101호', cap:70, tags:['빔프로젝터','에어컨'],          sch:[0,1,0,1,0,1,0,0,0] },
    { name:'201호', cap:45, tags:['빔프로젝터','에어컨'],          sch:[1,0,1,0,0,0,1,1,0] },
    { name:'301호', cap:55, tags:['빔프로젝터','에어컨'],          sch:[0,0,1,1,0,0,0,1,0] },
    { name:'302호', cap:55, tags:['빔프로젝터','에어컨'],          sch:[1,1,0,0,1,1,0,0,0] },
    { name:'401호', cap:90, tags:['빔프로젝터','에어컨','영상장비'],sch:[0,1,1,0,0,0,1,1,0] },
    { name:'402호', cap:40, tags:['에어컨','PC실'],                 sch:[1,0,0,1,1,0,0,0,0] },
    { name:'403호', cap:40, tags:['에어컨','PC실'],                 sch:[0,1,0,0,0,1,1,0,0] },
  ]},
  { id:'hum', name:'인문사회관', icon:'📚', rooms:[
    { name:'101호', cap:50, tags:['빔프로젝터','에어컨'],          sch:[1,0,1,0,1,0,0,0,0] },
    { name:'102호', cap:50, tags:['빔프로젝터','에어컨'],          sch:[0,1,0,1,0,1,0,0,0] },
    { name:'201호', cap:40, tags:['빔프로젝터','에어컨','세미나룸'],sch:[1,1,0,0,1,0,1,0,0] },
    { name:'202호', cap:40, tags:['빔프로젝터','에어컨'],          sch:[0,0,1,1,0,0,0,1,0] },
    { name:'203호', cap:30, tags:['에어컨','세미나룸'],            sch:[0,0,0,1,0,1,0,0,0] },
  ]},
  { id:'biz', name:'경영관', icon:'💼', rooms:[
    { name:'101호', cap:60, tags:['빔프로젝터','에어컨'],          sch:[1,0,1,0,0,1,0,0,0] },
    { name:'102호', cap:60, tags:['빔프로젝터','에어컨'],          sch:[0,1,0,1,0,0,1,0,0] },
    { name:'201호', cap:50, tags:['빔프로젝터','에어컨','세미나룸'],sch:[0,0,1,0,1,0,0,1,0] },
    { name:'202호', cap:50, tags:['빔프로젝터','에어컨'],          sch:[1,0,0,1,0,1,0,0,0] },
  ]},
];

let curPeriod = -1; /* -1=모두보기, 0=수업없음, 1-9=교시 */
let curBldg = 0;
let selectedPeriod = 0; /* 현재 표시 중인 교시 인덱스(0-8), -1=지금 */

function detectPeriod() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const mins = h * 60 + m;
  for (let i = 0; i < PERIOD_RANGES.length; i++) {
    const [sh, sm, eh, em] = PERIOD_RANGES[i];
    if (mins >= sh * 60 + sm && mins < eh * 60 + em) return i; /* 0-indexed */
  }
  if (mins >= 9 * 60 && mins < 18 * 60) return -2; /* 쉬는시간 */
  return -3; /* 수업 없는 시간 */
}

function formatTime(d) {
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  const hh = h > 12 ? h - 12 : h;
  return `${ampm} ${hh}:${String(m).padStart(2,'0')}`;
}

function updateHero() {
  const now = new Date();
  document.getElementById('heroTime').textContent = formatTime(now);
  const p = detectPeriod();
  if (p >= 0) {
    const [sh, sm] = PERIOD_RANGES[p];
    const [eh, em] = PERIOD_RANGES[p].slice(2);
    document.getElementById('heroPeriod').textContent = `현재 ${p+1}교시 수업 중`;
    document.getElementById('heroSub').textContent = `${sh}:${String(sm).padStart(2,'0')} ~ ${eh}:${String(em).padStart(2,'0')}`;
  } else if (p === -2) {
    document.getElementById('heroPeriod').textContent = '현재 쉬는 시간';
    document.getElementById('heroSub').textContent = '다음 교시까지 잠시 여유가 있어요';
  } else {
    document.getElementById('heroPeriod').textContent = '현재 수업 없는 시간';
    document.getElementById('heroSub').textContent = '수업시간: 오전 9시 ~ 오후 5시 50분';
  }
  return p;
}

function buildPeriodButtons(autoPeriod) {
  const row = document.getElementById('periodRow');
  row.innerHTML = '';

  /* 지금 버튼 */
  const nowBtn = document.createElement('button');
  nowBtn.className = 'period-btn' + (selectedPeriod === -1 ? ' active' : '');
  nowBtn.textContent = '지금';
  nowBtn.onclick = () => { selectedPeriod = -1; setActivePeriodBtn(0); renderRooms(); };
  row.appendChild(nowBtn);

  PERIOD_LABELS.forEach((lbl, i) => {
    const btn = document.createElement('button');
    btn.className = 'period-btn' + (selectedPeriod === i ? ' active' : '');
    btn.textContent = lbl;
    btn.onclick = () => { selectedPeriod = i; setActivePeriodBtn(i + 1); renderRooms(); };
    row.appendChild(btn);
  });

  /* 자동 선택 */
  if (autoPeriod >= 0) {
    selectedPeriod = autoPeriod;
    setActivePeriodBtn(autoPeriod + 1);
  } else {
    selectedPeriod = -1;
    setActivePeriodBtn(0);
  }
}

function setActivePeriodBtn(idx) {
  const btns = document.querySelectorAll('.period-btn');
  btns.forEach((b, i) => b.classList.toggle('active', i === idx));
}

function buildBldgButtons() {
  const row = document.getElementById('bldgRow');
  row.innerHTML = '';
  BUILDINGS.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'bldg-btn' + (i === curBldg ? ' active' : '');
    const avail = getAvailCount(b, getCheckPeriod());
    btn.innerHTML = `${b.icon} ${b.name}<span class="bldg-badge">${avail}/${b.rooms.length}</span>`;
    btn.onclick = () => { curBldg = i; renderBldgButtons(); renderRooms(); };
    row.appendChild(btn);
  });
}

function renderBldgButtons() {
  const btns = document.querySelectorAll('.bldg-btn');
  btns.forEach((b, i) => {
    b.classList.toggle('active', i === curBldg);
    const avail = getAvailCount(BUILDINGS[i], getCheckPeriod());
    b.querySelector('.bldg-badge').textContent = `${avail}/${BUILDINGS[i].rooms.length}`;
  });
}

function getCheckPeriod() {
  /* selectedPeriod: -1=지금(detectPeriod), 0-8=specific period */
  if (selectedPeriod === -1) {
    const p = detectPeriod();
    return p >= 0 ? p : -3; /* -3 = outside hours (all free) */
  }
  return selectedPeriod;
}

function isRoomFree(room, periodIdx) {
  if (periodIdx < 0) return true; /* outside hours → free */
  return room.sch[periodIdx] === 0;
}

function getAvailCount(bldg, periodIdx) {
  return bldg.rooms.filter(r => isRoomFree(r, periodIdx)).length;
}

function renderRooms() {
  const grid = document.getElementById('roomGrid');
  const bldg = BUILDINGS[curBldg];
  const p = getCheckPeriod();

  let availN = 0, busyN = 0;
  let html = '';

  bldg.rooms.forEach(room => {
    const free = isRoomFree(room, p);
    if (free) availN++; else busyN++;

    const slots = room.sch.map((occ, i) => {
      let cls = occ ? 'occ' : 'free';
      if (i === p && p >= 0) cls = 'cur';
      return `<div class="rc-slot ${cls}" title="${i+1}교시"></div>`;
    }).join('');

    const tags = room.tags.map(t => `<span class="rc-tag">${t}</span>`).join('');

    html += `
      <div class="room-card ${free ? 'available' : 'busy'}">
        <div class="rc-status"></div>
        <div class="rc-num">${room.name}</div>
        <div class="rc-cap">수용 인원 ${room.cap}명</div>
        <div class="rc-tags">${tags}</div>
        <div class="rc-avail-label">${free ? '✓ 사용 가능' : '수업 진행 중'}</div>
        <div class="rc-schedule">${slots}</div>
      </div>`;
  });

  grid.innerHTML = html;
  document.getElementById('availCount').textContent = availN;
  document.getElementById('busyCount').textContent = busyN;
  renderBldgButtons();
}

/* 초기화 */
const autoPeriod = updateHero();
buildPeriodButtons(autoPeriod >= 0 ? autoPeriod : -1);
buildBldgButtons();
renderRooms();

/* 매분 시계 업데이트 */
setInterval(() => { updateHero(); }, 30000);
</script>
</body>
</html>
