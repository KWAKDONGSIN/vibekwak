<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가성비 집사 - AI 식단 큐레이션</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --human:  #E65100;
      --human-l:#FFF3E0;
      --pet:    #1B5E20;
      --pet-l:  #E8F5E9;
      --danger: #C62828;
      --danger-l:#FFEBEE;
      --border: #E0E0E0;
      --bg:     #F5F5F5;
      --text:   #212121;
      --sub:    #757575;
    }
    body {
      font-family: -apple-system, 'Noto Sans KR', sans-serif;
      background: #e8e0d5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 40px;
    }
    .app {
      max-width: 440px; width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(0,0,0,.2);
      overflow: hidden;
      border: 6px solid #1a1a1a;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      padding: 22px 20px 18px;
      text-align: center;
    }
    header h1 { font-size: 20px; letter-spacing: -.5px; }
    header p  { font-size: 11px; color: #aaa; margin-top: 4px; }

    /* ── Section ── */
    .sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .sec-title {
      font-size: 11px; font-weight: 700;
      color: var(--sub); letter-spacing: .6px;
      text-transform: uppercase; margin-bottom: 10px;
    }

    /* ── Tag Input ── */
    .tag-wrap {
      display: flex; flex-wrap: wrap; gap: 6px;
      min-height: 46px;
      border: 1.5px solid var(--border); border-radius: 12px;
      padding: 8px; background: #fafafa; cursor: text;
      transition: border-color .2s, box-shadow .2s;
    }
    .tag-wrap:focus-within {
      border-color: var(--human);
      box-shadow: 0 0 0 3px rgba(230,81,0,.15);
    }
    .tag {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--human); color: white;
      animation: pop .18s ease;
    }
    .tag.dtag { background: var(--danger); }
    .tag .x { cursor: pointer; font-size: 15px; line-height: 1; opacity: .8; }
    .tag .x:hover { opacity: 1; }
    #tinput {
      flex: 1; min-width: 80px; border: none;
      background: transparent; font-size: 13px; outline: none;
    }
    .tag-hint { font-size: 11px; color: var(--sub); margin-top: 6px; }

    /* ── Quick Add ── */
    .quick { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .qbtn {
      font-size: 11px; padding: 4px 10px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: white; cursor: pointer;
      transition: all .15s;
    }
    .qbtn:hover  { border-color: var(--human); color: var(--human); }
    .qbtn.on     { background: var(--human); color: white; border-color: var(--human); }

    /* ── Pet Selector ── */
    .pet-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .pbtn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 4px; border: 2px solid var(--border); border-radius: 12px;
      background: white; cursor: pointer; transition: all .2s;
    }
    .pbtn span:first-child { font-size: 24px; }
    .pbtn .plabel { font-size: 11px; font-weight: 600; color: var(--sub); }
    .pbtn.on { border-color: var(--pet); background: var(--pet-l); }
    .pbtn.on .plabel { color: var(--pet); }

    /* ── Danger Panel ── */
    #dpanel {
      display: none; margin: 0 16px;
      background: var(--danger-l); border: 1.5px solid var(--danger);
      border-radius: 12px; padding: 11px 13px;
    }
    #dpanel.show { display: block; }
    .dtitle { font-size: 12px; font-weight: 700; color: var(--danger); margin-bottom: 7px; }
    .dchips { display: flex; flex-wrap: wrap; gap: 5px; }
    .dchip {
      font-size: 11px; padding: 3px 9px;
      background: var(--danger); color: white; border-radius: 20px;
    }
    .dchip em { font-style: normal; opacity: .75; font-size: 10px; }

    /* ── Run Button ── */
    .run-btn {
      display: block; width: calc(100% - 32px);
      margin: 14px 16px;
      padding: 14px; font-size: 15px; font-weight: 700;
      background: linear-gradient(135deg, #E65100, #BF360C);
      color: white; border: none; border-radius: 14px;
      cursor: pointer; letter-spacing: -.2px;
      box-shadow: 0 4px 18px rgba(230,81,0,.4);
      transition: transform .18s, box-shadow .18s;
    }
    .run-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 24px rgba(230,81,0,.5); }
    .run-btn:active { transform: scale(.97); }

    /* ── Results ── */
    #results { display: none; }
    .res-head { display: grid; grid-template-columns: 1fr 1fr; }
    .res-label {
      padding: 9px; text-align: center;
      font-size: 12px; font-weight: 700;
    }
    .res-label.h { background: var(--human-l); color: var(--human); }
    .res-label.p { background: var(--pet-l);   color: var(--pet);   }
    .res-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--border);
    }
    .res-col { background: white; padding: 10px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Recipe Card ── */
    .rcard { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeUp .3s ease both; }
    .rcard-top { padding: 10px; }
    .rcard-name { font-size: 13px; font-weight: 700; }
    .rmeta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .rbadge {
      font-size: 10px; padding: 2px 7px;
      background: #f0f0f0; color: var(--sub); border-radius: 10px;
    }
    .mbar-wrap { height: 4px; background: #eee; border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .mbar { height: 100%; border-radius: 2px; transition: width .6s ease; }
    .mbar.h { background: linear-gradient(90deg,#E65100,#FF6D00); }
    .mbar.p { background: linear-gradient(90deg,#1B5E20,#43A047); }
    .mpct { font-size: 10px; color: var(--sub); margin-top: 3px; }

    .ing-list { padding: 8px 10px; border-top: 1px solid #f0f0f0; background: #fafafa; }
    .ing { font-size: 11px; padding: 2px 0; display: flex; align-items: center; gap: 4px; }
    .ing.have    { color: #2E7D32; }
    .ing.miss    { color: #9E9E9E; }
    .ing.warn    { color: var(--danger); font-weight: 700; }

    .steps { padding: 8px 10px 11px; border-top: 1px solid #f0f0f0; }
    .step  { font-size: 11px; color: var(--sub); padding: 3px 0; display: flex; gap: 6px; align-items: flex-start; }
    .snum  {
      width: 15px; height: 15px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; margin-top: 1px;
    }
    .snum.h { background: var(--human); }
    .snum.p { background: var(--pet); }

    .empty { text-align: center; font-size: 12px; color: var(--sub); padding: 24px 8px; }

    /* ── Safety Panel ── */
    #safepanel { display: none; }
    #safepanel.show { display: block; }
    .safe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 0 16px 16px; }
    .safe-item {
      padding: 7px 9px;
      background: var(--danger-l); border-left: 3px solid var(--danger);
      border-radius: 0 8px 8px 0;
    }
    .safe-food   { font-size: 11px; font-weight: 700; color: var(--danger); }
    .safe-reason { font-size: 10px; color: var(--sub); margin-top: 1px; }
    .safe-head   { font-size: 11px; font-weight: 700; color: var(--sub); padding: 12px 16px 8px; }

    /* ── Footer ── */
    footer { padding: 14px 16px 16px; border-top: 1px solid var(--border); text-align: center; }
    footer p { font-size: 11px; color: #aaa; margin-bottom: 10px; }
    .go-btn {
      display: block; width: 100%; padding: 11px;
      background: #2E7D32; color: white; font-size: 13px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .18s;
    }
    .go-btn:hover { background: #1B5E20; }

    @keyframes pop     { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<div class="app">

  <header>
    <h1>🍱 가성비 집사</h1>

  <button class="run-btn" onclick="runAI()">🤖 AI 듀얼 큐레이션 실행하기</button>

  <div id="results">

    </div>
    <div class="res-grid">
      <div class="res-col" id="hCol"></div>
      <div class="res-col" id="pCol"></div>
    </div>
  </div>

  <!-- ⑥ 금지 식품 참고표 -->
  <div id="safepanel">
    <div class="safe-head" id="safeHead">🚫 강아지 금지 식품</div>
    <div class="safe-grid" id="safeGrid"></div>
  </div>

  <footer>
    <p>"나만 맛있는 거 먹나?" 미안함 0% 도전</p>

  </footer>
</div>

const PET_EMOJI = { 강아지:"🐶", 고양이:"🐱", 토끼:"🐰", 햄스터:"🐹" };

/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
let tags = [];
let pet  = "강아지";

/* ════════════════════════════════════
   INIT
════════════════════════════════════ */
(function init() {
  const area = document.getElementById('quickArea');
  QUICK.forEach(ing => {
    const b = document.createElement('button');
    b.className = 'qbtn'; b.textContent = ing; b.dataset.ing = ing;
    b.onclick = () => toggleQuick(b, ing);
    area.appendChild(b);
  });

  const inp = document.getElementById('tinput');
  inp.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ',') && inp.value.trim()) {
      e.preventDefault();
      addTag(inp.value.trim().replace(',', ''));
      inp.value = '';
    }
    if (e.key === 'Backspace' && !inp.value && tags.length) removeTag(tags.at(-1));
  });
})();

/* ════════════════════════════════════
   TAG MANAGEMENT
════════════════════════════════════ */
function addTag(name) {
  if (!name || tags.includes(name)) return;
  tags.push(name);
  renderTags(); checkDanger();
}
function removeTag(name) {
  tags = tags.filter(t => t !== name);
  document.querySelectorAll('.qbtn').forEach(b => { if (b.dataset.ing === name) b.classList.remove('on'); });
  renderTags(); checkDanger();
}
function toggleQuick(btn, ing) {
  tags.includes(ing) ? removeTag(ing) : addTag(ing);
  btn.classList.toggle('on', tags.includes(ing));
}
function renderTags() {
  const wrap = document.getElementById('tagWrap');
  const inp  = document.getElementById('tinput');
  wrap.querySelectorAll('.tag').forEach(t => t.remove());
  const dl = DANGER[pet].map(d => d.f);
  tags.forEach(name => {
    const t = document.createElement('div');
    const isDanger = dl.includes(name);
    t.className = 'tag' + (isDanger ? ' dtag' : '');
    t.innerHTML = `${isDanger ? '⚠️ ' : ''}${name} <span class="x" onclick="removeTag('${name}')">×</span>`;
    wrap.insertBefore(t, inp);
  });
}
function checkDanger() {
  const dl  = DANGER[pet];
  const hit = dl.filter(d => tags.includes(d.f));
  const panel = document.getElementById('dpanel');
  panel.classList.toggle('show', hit.length > 0);
  document.getElementById('dchips').innerHTML = hit.map(d =>
    `<div class="dchip">${d.f} <em>(${d.r})</em></div>`
  ).join('');
}

/* ════════════════════════════════════
   PET SELECT
════════════════════════════════════ */
function selectPet(btn) {
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  pet = btn.dataset.pet;
  document.getElementById('petLabel').textContent = `${PET_EMOJI[pet]} ${pet}용`;
  renderTags(); checkDanger();
  if (document.getElementById('safepanel').classList.contains('show')) renderSafe();
}

/* ════════════════════════════════════
   RECIPE MATCHING
════════════════════════════════════ */
function score(recipe) {
  if (!tags.length) return 0;
  const all  = [...recipe.req, ...(recipe.opt || [])];
  const hit  = all.filter(i => tags.includes(i));
  const reqHit = recipe.req.filter(i => tags.includes(i));
  if (recipe.req.length && !reqHit.length) return 0;
  return Math.round(hit.length / all.length * 100);
}
function top(recipes, n = 3) {
  return recipes.map(r => ({...r, score: score(r)}))
    .filter(r => r.score > 0)
    .sort((a,b) => b.score - a.score)
    .slice(0, n);
}

/* ════════════════════════════════════
   RENDER
════════════════════════════════════ */
function runAI() {
  // 입력창에 남은 텍스트가 있으면 자동으로 태그 등록
  const inp = document.getElementById('tinput');
  if (inp.value.trim()) {
    addTag(inp.value.trim());
    inp.value = '';
  }
  if (!tags.length) { alert('냉장고 재료를 먼저 입력하거나 아래 버튼을 눌러주세요!'); return; }
  const hr = top(H_RECIPES);
  const pr = top(P_RECIPES[pet]);
  document.getElementById('results').style.display = 'block';
  renderCol('hCol', hr, 'h');
  renderCol('pCol', pr, 'p');
  renderSafe();
  document.getElementById('safepanel').classList.add('show');
  document.getElementById('results').scrollIntoView({ behavior:'smooth' });
}

function renderCol(id, recipes, type) {
  const col = document.getElementById(id);
  const dl  = DANGER[pet].map(d => d.f);
  if (!recipes.length) {
    col.innerHTML = `<div class="empty">재료와 맞는 레시피가 없어요 😅<br>재료를 더 추가해보세요!</div>`;
    return;
  }
  col.innerHTML = recipes.map((r, idx) => {
    const all  = [...new Set([...r.req,...(r.opt||[])])];
    const have = all.filter(i => tags.includes(i));
    const miss = all.filter(i => !tags.includes(i));
    const warn = (type === 'h') ? all.filter(i => dl.includes(i)) : [];
    return `
      <div class="rcard" style="animation-delay:${idx*.1}s">
        <div class="rcard-top">
          <div class="rcard-name">${r.e} ${r.name}</div>
          <div class="rmeta">
            <span class="rbadge">⏱ ${r.t}</span>
            <span class="rbadge">💪 ${r.d}</span>
            ${r.cal ? `<span class="rbadge">🔥 ${r.cal}kcal</span>` : ''}
          </div>
          <div class="mbar-wrap"><div class="mbar ${type}" style="width:${r.score}%"></div></div>
          <div class="mpct">재료 일치 ${r.score}%</div>
        </div>
        <div class="ing-list">
          ${have.map(i => `<div class="ing have">✅ ${i}</div>`).join('')}
          ${miss.map(i => `<div class="ing miss">➕ ${i} (필요)</div>`).join('')}
          ${warn.map(i => `<div class="ing warn">⚠️ ${i} (${pet} 주의)</div>`).join('')}
        </div>
        <div class="steps">
          ${r.steps.map((s,i) => `
            <div class="step">
              <span class="snum ${type}">${i+1}</span>
              <span>${s}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderSafe() {
  document.getElementById('safeHead').textContent = `🚫 ${PET_EMOJI[pet]} ${pet} 금지 식품`;
  document.getElementById('safeGrid').innerHTML = DANGER[pet].map(d =>
    `<div class="safe-item">
      <div class="safe-food">${d.f}</div>
      <div class="safe-reason">${d.r}</div>
    </div>`
  ).join('');
}
